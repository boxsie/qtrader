name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install requirements
        run: |
          pip install -r agent/requirements.txt
          pip install -r dashboard/requirements.txt
          pip install -r dataservice/requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Import smoke test
        run: |
          python -c "import agent.ticker, agent.train"
          python -c "import agent.rewards.factory"
          python -c "import dashboard.server"
