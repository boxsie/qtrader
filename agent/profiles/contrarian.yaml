# Contrarian Trader Profile
#
# Contrarian value-seeking trader that buys dips and sells spikes.
# Goes against momentum, seeks to profit from reversals.

name: Contrarian
description: Value-seeking trader that buys dips and sells spikes against momentum

# Timeframe weights - focus on recent action
timeframe_weights:
  1m: 0.4
  5m: 0.3
  15m: 0.2
  1h: 0.1

# Reward configuration - contrarian focused
reward_config:
  # Big rewards for buying dips and selling spikes
  - type: buy_the_dip
    weight: 5.0
    params:
      lookback: 15
      dip_threshold: 0.015   # 1.5% drop = dip
      spike_threshold: 0.015  # 1.5% rise = spike
      dip_buy_reward: 10.0
      spike_sell_reward: 10.0

  # Penalize momentum-aligned trades (we're contrarian!)
  - type: momentum_alignment
    weight: -1.0  # NEGATIVE weight = penalize alignment
    params:
      lookback: 10
      alignment_reward: 2.0
      misalignment_penalty: 0.5

  # Still care about profits
  - type: profit_loss
    weight: 2.0
    params:
      profit_multiplier: 12.0
      loss_multiplier: 4.0

  # Be selective with trades
  - type: trade_frequency
    weight: 1.0
    params:
      penalty_per_trade: 0.1

  # Drawdown protection
  - type: drawdown_penalty
    weight: 1.5
    params:
      penalty_multiplier: 5.0

  # Prefer larger positions when we have conviction
  - type: position_sizing
    weight: 1.0
    params:
      optimal_position_pct: 0.75
      tolerance: 0.25
      max_penalty: 2.0
